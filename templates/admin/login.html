{% extends "base.html" %}
{% block title %}Tutor login - TutorIlya Homework{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <img class="logo-img" src="{{ url_for('static', filename='logo/logo_admin.png') }}" alt="TutorIlya Admin">
    <h1>Tutor login</h1>
    {% if error %}<div class="errors">{{ error }}</div>{% endif %}
    <form method="post" class="form">{{ csrf_field() }}
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <button type="submit" class="button-lg">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
