<div class="notif-wrap">
  <button type="button" class="icon-btn" id="admin-notif-bell" aria-label="Notifications{% if admin_unread_count %} ({{ admin_unread_count }} new){% endif %}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    {% if admin_unread_count %}<span class="notif-badge">{{ admin_unread_count }}</span>{% endif %}
  </button>
  <div class="notif-dropdown" id="admin-notif-dropdown" hidden>
    <div class="notif-header">
      <strong>Notifications</strong>
      {% if admin_unread_count %}
      <form method="post" action="{{ url_for('admin.notifications_mark_all_read') }}">{{ csrf_field() }}
        <button type="submit" class="notif-mark-all">Mark all read</button>
      </form>
      {% endif %}
    </div>
    {% if not admin_notifications %}
      <p class="muted notif-empty">No notifications yet.</p>
    {% else %}
      {% for n in admin_notifications %}
      <a class="notif-item {{ '' if n['is_read'] else 'notif-unread' }}" href="{{ url_for('admin.notification_open', notification_id=n['id']) }}">
        <span class="notif-title">{{ n['title'] }}</span>
        <span class="notif-time muted">{{ n['created_at'] }}</span>
      </a>
      {% endfor %}
    {% endif %}
  </div>
</div>
<script>initNotifDropdown('admin-notif-bell', 'admin-notif-dropdown');</script>
