{% extends "base.html" %}
{% block title %}{{ t('login.title') }} - {{ t('site_name') }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <img class="logo-img" src="{{ url_for('static', filename='logo/logo_student.png') }}" alt="TutorIlya Student Area">
    <div class="lang-switch" role="group" aria-label="Language">
      <form method="post" action="{{ url_for('student.set_language', lang='en') }}" class="lang-form">{{ csrf_field() }}
        <button type="submit" class="lang-btn {{ 'lang-active' if session.get('lang', 'en') == 'en' else '' }}">EN</button>
      </form>
      <form method="post" action="{{ url_for('student.set_language', lang='ru') }}" class="lang-form">{{ csrf_field() }}
        <button type="submit" class="lang-btn {{ 'lang-active' if session.get('lang') == 'ru' else '' }}">RU</button>
      </form>
    </div>
    <h1>{{ t('login.title') }}</h1>
    {% if error %}<div class="errors">{{ error }}</div>{% endif %}
    <form method="post" class="form">{{ csrf_field() }}
      <label>
        {{ t('login.username') }}
        <input type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
      </label>
      <label>
        {{ t('login.password') }}
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="button-lg">{{ t('login.submit') }}</button>
    </form>
  </div>
</div>
{% endblock %}
