<div class="notif-wrap">
  <button type="button" class="notif-bell" id="student-notif-bell" aria-label="Notifications">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 3C9.2 3 7 5.2 7 8V11.5L5.5 14.5C5.2 15.1 5.6 15.8 6.3 15.8H17.7C18.4 15.8 18.8 15.1 18.5 14.5L17 11.5V8C17 5.2 14.8 3 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M9.5 18.5C9.8 19.6 10.8 20.3 12 20.3C13.2 20.3 14.2 19.6 14.5 18.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    {% if student_unread_count %}<span class="notif-badge">{{ student_unread_count }}</span>{% endif %}
  </button>
  <div class="notif-dropdown" id="student-notif-dropdown" hidden>
    <div class="notif-header">
      <strong>{{ t('nav.notifications') }}</strong>
      {% if student_unread_count %}
      <form method="post" action="{{ url_for('student.notifications_mark_all_read') }}">
        <button type="submit" class="notif-mark-all">{{ t('nav.notifications_mark_all') }}</button>
      </form>
      {% endif %}
    </div>
    {% if not student_notifications %}
      <p class="muted notif-empty">{{ t('nav.notifications_empty') }}</p>
    {% else %}
      {% for n in student_notifications %}
      <a class="notif-item {{ '' if n['is_read'] else 'notif-unread' }}" href="{{ url_for('student.notification_open', notification_id=n['id']) }}">
        <span class="notif-title">{{ n['title'] }}</span>
        <span class="notif-time muted">{{ n['created_at'] }}</span>
      </a>
      {% endfor %}
    {% endif %}
  </div>
</div>

<script src="{{ url_for('static', filename='notifications.js') }}"></script>
<script>initNotifDropdown('student-notif-bell', 'student-notif-dropdown');</script>
