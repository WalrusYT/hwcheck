<div class="notif-wrap">
  <button type="button" class="icon-btn" id="student-notif-bell" aria-label="{{ t('nav.notifications') }}{% if student_unread_count %} ({{ student_unread_count }}){% endif %}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    {% if student_unread_count %}<span class="notif-badge">{{ student_unread_count }}</span>{% endif %}
  </button>
  <div class="notif-dropdown" id="student-notif-dropdown" hidden>
    <div class="notif-header">
      <strong>{{ t('nav.notifications') }}</strong>
      {% if student_unread_count %}
      <form method="post" action="{{ url_for('student.notifications_mark_all_read') }}">{{ csrf_field() }}
        <button type="submit" class="notif-mark-all">{{ t('nav.notifications_mark_all') }}</button>
      </form>
      {% endif %}
    </div>
    {% if not student_notifications %}
      <p class="muted notif-empty">{{ t('nav.notifications_empty') }}</p>
    {% else %}
      {% for n in student_notifications %}
      <a class="notif-item {{ '' if n['is_read'] else 'notif-unread' }}" href="{{ url_for('student.notification_open', notification_id=n['id']) }}">
        <span class="notif-title">{{ n['title'] }}</span>
        <span class="notif-time muted">{{ n['created_at'] }}</span>
      </a>
      {% endfor %}
    {% endif %}
  </div>
</div>
<script>initNotifDropdown('student-notif-bell', 'student-notif-dropdown');</script>
