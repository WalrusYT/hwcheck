services:
  - type: web
    name: hwcheck
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: AI grading runs on in-process threads, and the
    # startup sweep in app.py assumes no other worker owns a pending job.
    startCommand: gunicorn app:app --workers 1 --timeout 120
    # Deploy a push to main only after GitHub Actions CI is green.
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    disk:
      name: hwcheck-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
